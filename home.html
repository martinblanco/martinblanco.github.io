<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revista Banderas</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
    <div id="navbar-container"></div>
    <main>
        <section class="py-4">
            <div class="container px-4 px-lg-5 my-5">
                <div class="row gx-4 gx-lg-5 align-items-center">
                    <div class="col-md-6">
                        <img class="img-fluid mb-4 mb-md-0" src="assets/Revista0.jpg" alt="Portada Revista #5" />
                    </div>
                    <div class="col-md-6">
                        <div class="small mb-1">#5</div>
                        <h1 class="display-5 fw-bolder">Revista #5</h1>
                        <p class="lead">tremenda revista</p>
                        <a href="https://summer-mouse-8760.blancomartin98.workers.dev/descargar" download class="btn btn-outline-dark mb-3" rel="noopener">DESCARGAR PDF</a>
                        <div id="contador" class="lead">Descargas: —</div>
                    </div>
                </div>
            </div>
        </section>
        <section class="py-4 bg-light">
            <div class="container my-5">
                <h2 class="fw-bolder mb-4">Anteriores</h2>
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper" id="swiperWrapper"></div>
                    <div class="swiper-button-next" aria-label="Siguiente"></div>
                    <div class="swiper-button-prev" aria-label="Anterior"></div>
                </div>
            </div>
        </section>
    </main>
    <footer class="py-4 bg-dark">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; Revista Banderas</p>
        </div>
    </footer>
    <script defer src="js/cargar-navbar.js"></script>
    <script defer src="js/revistas-todas.js"></script>
    <script defer src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script defer src="js/swiper.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('https://summer-mouse-8760.blancomartin98.workers.dev/contador')
            .then(r => r.text())
            .then(c => document.getElementById('contador').textContent = `Descargas: ${c}`)
            .catch(() => document.getElementById('contador').textContent = 'Descargas: —');
    </script>
</body>
</html>
